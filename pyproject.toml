[project]
name = "jobresearcher"
version = "0.1.0"
description = "Personal job-post aggregator for selected Telegram sources"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
jobresearcher = "jobresearcher.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"